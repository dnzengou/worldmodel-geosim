  <text x="80" y="560" font-family="monospace" font-size="18" fill="#64748b">Open-source · No login · Agent-ready API</text>
  <text x="80" y="590" font-family="monospace" font-size="16" fill="#00d4ff">worldmodel-geosim.vercel.app</text>
